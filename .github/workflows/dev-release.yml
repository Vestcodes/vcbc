name: Development Release

on:
  push:
    branches: [ develop ]
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version type for development release'
        required: true
        default: 'patch'
        type: choice
        options:
        - patch
        - minor
        - major

env:
  CARGO_TERM_COLOR: always

jobs:
  dev-release:
    name: Development Release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install dependencies
        run: |
          cargo install cargo-release git-cliff

      - name: Configure Git
        run: |
          git config --global user.name "VCBC Bot"
          git config --global user.email "bot@vcbc.dev"

      - name: Get version type
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "type=${{ inputs.version_type }}" >> $GITHUB_OUTPUT
          else
            echo "type=patch" >> $GITHUB_OUTPUT
          fi

      - name: Create development release
        run: |
          VERSION_TYPE=${{ steps.version.outputs.type }}
          case $VERSION_TYPE in
            patch)
              cargo release patch --execute --no-confirm --allow-branch develop
              ;;
            minor)
              cargo release minor --execute --no-confirm --allow-branch develop
              ;;
            major)
              cargo release major --execute --no-confirm --allow-branch develop
              ;;
          esac

      - name: Get latest tag
        id: tag
        run: echo "tag=$(git describe --tags --abbrev=0)" >> $GITHUB_OUTPUT

      - name: Generate changelog
        run: git-cliff --latest --strip all > CHANGELOG.md

      - name: Commit changelog
        run: |
          git add CHANGELOG.md
          git commit -m "docs: update changelog for development release [skip ci]" || echo "No changes to commit"

      - name: Push changes
        run: git push origin develop

      - name: Create development GitHub release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Development Release ${{ steps.tag.outputs.tag }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-dev-docker:
    name: Publish Development Docker Image
    runs-on: ubuntu-latest
    needs: dev-release
    if: success()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version
        run: echo "VERSION=dev-$(date +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push development Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            vcbc:develop
            vcbc:${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=VCBC
            org.opencontainers.image.description=VCBC Blockchain - Development Build
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.created=${{ steps.prep.outputs.created }}
            org.opencontainers.image.revision=${{ github.sha }}
